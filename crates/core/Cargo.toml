[package]
name = "cat-blog-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.2.5"
comrak = { version = "1.2.0", default-features = false, features = ["syntect-fancy"] }
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
lol_html = "3.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-themes", "html"] }
unicode-normalization = "0.1.26"

[lints]
workspace = true
