[package]
name = "cat-blog-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cat-blog"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum.workspace = true
base64 = "0.22.1"
cat-blog-core = { version = "1.0.0", path = "../core" }
dotenvy.workspace = true
form_urlencoded = "1.2.3"
ipnet = "2.12.2"
jiff.workspace = true
rand = { version = "0.10.4", default-features = false, features = ["sys_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx.workspace = true
subtle = "2.6.1"
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tower.workspace = true

[lints]
workspace = true
