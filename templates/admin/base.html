<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ admin.title }} - cat-blog 后台</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{ admin.css }}">
<link rel="icon" href="{{ admin.favicon }}" type="image/svg+xml">
<script src="{{ admin.theme_js }}" defer></script>
{%- if let Some(editor) = admin.editor_js %}
<script src="{{ editor }}" defer></script>
{%- endif %}
</head>
<body class="admin">
<div class="wrap">
<header class="site">
<div class="site-bar">
<a class="site-title" href="/admin/">ฅ^•ﻌ•^ฅ 后台</a>
<button class="theme-toggle" type="button" hidden aria-label="切换亮色和暗色主题" title="切换亮色和暗色主题">
<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
</div>
{%- if let Some(csrf) = admin.csrf %}
<nav class="site-nav admin-nav">
<a href="/admin/">首页</a><span aria-hidden="true">|</span><a href="/admin/pages/">Pages</a><span aria-hidden="true">|</span><a href="/admin/posts/">Blog</a><span aria-hidden="true">|</span><a href="/" target="_blank">查看站点</a><span aria-hidden="true">|</span><form method="post" action="/admin/logout"><input type="hidden" name="_csrf" value="{{ csrf }}"><button type="submit" class="link">退出</button></form>
</nav>
{%- endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</div>
</body>
</html>
