{% extends "admin/base.html" %}
{% block content %}
<div class="admin-head">
<h1>{{ heading }}</h1>
<a class="button" href="{{ new_href }}">新建</a>
</div>
{%- if rows.is_empty() %}
<p class="empty">还没有内容，点“新建”写第一篇。</p>
{%- else %}
<table class="admin-list">
<thead><tr><th>标题</th><th>日期</th><th>状态</th></tr></thead>
<tbody>
{%- for row in rows %}
<tr><td><a href="{{ row.edit_href }}">{{ row.title }}</a></td><td><time>{{ row.date }}</time></td><td>{% if let Some(mark) = row.mark %}<span class="badge">{{ mark }}</span>{% endif %}</td></tr>
{%- endfor %}
</tbody>
</table>
{%- endif %}
{% endblock %}
