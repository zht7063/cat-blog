<!doctype html>
<html lang="{{ layout.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ layout.title }}</title>
{%- if !layout.description.is_empty() %}
<meta name="description" content="{{ layout.description }}">
{%- endif %}
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{ layout.assets.css }}">
<link rel="icon" href="{{ layout.assets.favicon }}" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{ layout.site_title }}" href="/feed.xml">
<script src="{{ layout.assets.js }}" defer></script>
</head>
<body>
<div class="wrap">
<header class="site">
<div class="site-bar">
<a class="site-title" href="/">{{ layout.site_title }}</a>
<button class="theme-toggle" type="button" hidden aria-label="{{ layout.texts.toggle_theme }}" title="{{ layout.texts.toggle_theme }}">
<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
</div>
<nav class="site-nav">{{ layout.nav_html|safe }}</nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site">Powered by cat-blog ฅ^•ﻌ•^ฅ</footer>
</div>
</body>
</html>
